<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ระบบจัดการที่พักอาศัย</title>
<meta name="description" content="ระบบจัดการที่พักอาศัยบน GitHub Pages + Firebase">
<style>
:root{--brand:#2563eb;--brand2:#1d4ed8;--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#64748b;--line:#e2e8f0;--danger:#dc2626;--ok:#16a34a}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#1d4ed8,#0f172a)}.auth-card{width:min(430px,100%);background:#fff;border-radius:24px;padding:28px;box-shadow:0 20px 60px #0003}.logo{font-size:42px;text-align:center}.title{text-align:center;margin:8px 0 4px}.sub{text-align:center;color:var(--muted);margin:0 0 22px}.field{display:grid;gap:7px;margin:12px 0}.field label{font-size:13px;font-weight:700}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;outline:none;background:#fff}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px #2563eb18}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:700}.primary{background:var(--brand);color:#fff}.primary:hover{background:var(--brand2)}.outline{background:#fff;border:1px solid var(--line)}.danger{background:#fee2e2;color:#991b1b}.msg{min-height:22px;color:var(--danger);font-size:13px;margin-top:8px}.app{min-height:100vh}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:5}.brand{font-weight:900;color:var(--brand)}.userbar{display:flex;align-items:center;gap:10px}.pill{padding:5px 9px;border-radius:999px;background:#dbeafe;color:#1e40af;font-size:12px;font-weight:800}.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 64px)}aside{background:#0f172a;padding:16px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#cbd5e1;text-align:left;padding:11px 12px;border-radius:10px}.nav button.active,.nav button:hover{background:#1e293b;color:#fff}.main{padding:22px;max-width:1400px;width:100%;margin:auto}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.head h2{margin:0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}.stat{font-size:28px;font-weight:900;margin-top:5px}.muted{color:var(--muted);font-size:13px}.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px}.table{width:100%;border-collapse:collapse;min-width:720px}.table th,.table td{padding:12px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.table th{background:#f8fafc}.section{margin-top:18px}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.empty{padding:35px;text-align:center;color:var(--muted)}.toast{position:fixed;right:18px;bottom:18px;background:#0f172a;color:#fff;padding:12px 15px;border-radius:12px;z-index:20;box-shadow:0 10px 30px #0003}.modal{position:fixed;inset:0;background:#0006;display:grid;place-items:center;padding:18px;z-index:10}.modal-card{background:#fff;border-radius:18px;padding:20px;width:min(600px,100%);max-height:90vh;overflow:auto}.actions{display:flex;gap:8px;flex-wrap:wrap}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#f1f5f9;font-size:12px}.ok{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}@media(max-width:900px){.layout{grid-template-columns:1fr}aside{position:sticky;top:64px;z-index:4;padding:8px;overflow:auto}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.grid{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}}@media(max-width:520px){.main{padding:14px}.grid{grid-template-columns:1fr}.top{padding:0 12px}.userbar .email{display:none}}
</style>
</head>
<body>
<div id="auth" class="auth">
  <div class="auth-card">
    <div class="logo">🏠</div><h1 class="title">ระบบจัดการที่พักอาศัย</h1><p class="sub">GitHub Pages + Firebase</p>
    <div id="loginForm">
      <div class="field"><label>อีเมล</label><input id="email" type="email" autocomplete="username" placeholder="name@example.com"></div>
      <div class="field"><label>รหัสผ่าน</label><input id="password" type="password" autocomplete="current-password" placeholder="••••••••"></div>
      <button id="loginBtn" class="btn primary" style="width:100%">เข้าสู่ระบบ</button>
      <button id="signupBtn" class="btn outline" style="width:100%;margin-top:9px">สมัครบัญชีใหม่</button>
    </div>
    <div id="authMsg" class="msg"></div>
    <p class="muted" style="margin-top:18px">ระบบนี้ไม่ใช้ API route หรือ server secret จึงเหมาะกับ GitHub Pages</p>
  </div>
</div>
<div id="app" class="app hidden">
  <header class="top"><div class="brand">🏠 ระบบจัดการที่พักอาศัย</div><div class="userbar"><span id="rolePill" class="pill">กำลังโหลด</span><span id="userEmail" class="email muted"></span><button id="logoutBtn" class="btn outline">ออกจากระบบ</button></div></header>
  <div class="layout">
    <aside><nav class="nav" id="nav"></nav></aside>
    <main class="main"><div id="content"></div></main>
  </div>
</div>
<div id="modal" class="modal hidden"><div class="modal-card" id="modalCard"></div></div>
<div id="toast" class="toast hidden"></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js';
import {getFirestore,collection,doc,getDoc,getDocs,query,where,orderBy,limit,addDoc,setDoc,updateDoc,deleteDoc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js';

const firebaseConfig={apiKey:'AIzaSyCI4sasDSZOr8txLyeOl6RI-szFkW9gZx8',authDomain:'home-8e824.firebaseapp.com',projectId:'home-8e824',storageBucket:'home-8e824.firebasestorage.app',messagingSenderId:'798232728283',appId:'1:798232728283:web:4488a32b4f13c0141a72fe'};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
let me=null,profile=null,role='resident',view='dashboard';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2600)}
function err(s){$('authMsg').textContent=s}
function money(n){return new Intl.NumberFormat('th-TH',{style:'currency',currency:'THB',maximumFractionDigits:2}).format(Number(n)||0)}
function date(v){if(!v)return '-';try{return new Date(v.seconds? v.seconds*1000:v).toLocaleDateString('th-TH')}catch{return String(v)}}
async function userProfile(u){const snap=await getDoc(doc(db,'users',u.uid));return snap.exists()?snap.data():null}
function nav(){const items=role==='admin'?[['dashboard','📊 ภาพรวม'],['members','👥 สมาชิก'],['bills','💳 ค่าใช้จ่าย'],['repairs','🛠️ แจ้งซ่อม'],['borrows','📦 ยืม-คืน'],['logs','📜 ประวัติ']]:[['dashboard','🏠 หน้าหลัก'],['bills','💳 ค่าใช้จ่าย'],['repairs','🛠️ แจ้งซ่อม'],['borrows','📦 ยืมของ'],['profile','👤 โปรไฟล์']];$('nav').innerHTML=items.map(([id,t])=>`<button class="${view===id?'active':''}" data-view="${id}">${t}</button>`).join('');document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()})}
async function getAll(name){const snap=await getDocs(collection(db,name));return snap.docs.map(d=>({id:d.id,...d.data()}))}
async function render(){nav();const c=$('content');c.innerHTML='<div class="card">กำลังโหลดข้อมูล...</div>';try{if(view==='dashboard')await dashboard(c);else if(view==='members')await members(c);else if(view==='bills')await bills(c);else if(view==='repairs')await repairs(c);else if(view==='borrows')await borrows(c);else if(view==='profile')await profilePage(c);else if(view==='logs')await logs(c)}catch(e){c.innerHTML=`<div class="card"><b>เกิดข้อผิดพลาด</b><p class="muted">${esc(e.message)}</p></div>`}}
async function dashboard(c){const [us,bs,rs,br]=await Promise.all([getAll('users'),getAll('bills'),getAll('repairs'),getAll('borrows')]);const mine=role==='admin'?us:us.filter(x=>x.uid===me.uid);const billsMine=role==='admin'?bs:bs.filter(x=>x.userId===me.uid);const repairsMine=role==='admin'?rs:rs.filter(x=>x.userId===me.uid);c.innerHTML=`<div class="head"><div><h2>ภาพรวม</h2><span class="muted">ยินดีต้อนรับ ${esc(profile?.nameTH||me.email)}</span></div></div><div class="grid"><div class="card"><div class="muted">สมาชิก</div><div class="stat">${mine.length}</div></div><div class="card"><div class="muted">บิล</div><div class="stat">${billsMine.length}</div></div><div class="card"><div class="muted">แจ้งซ่อม</div><div class="stat">${repairsMine.length}</div></div><div class="card"><div class="muted">รายการยืม</div><div class="stat">${role==='admin'?br.length:br.filter(x=>x.userId===me.uid).length}</div></div></div><div class="section two"><div class="card"><b>สถานะระบบ</b><p class="muted">ข้อมูลถูกอ่าน/บันทึกโดย Firebase ฝั่งเบราว์เซอร์ และสิทธิ์จริงควบคุมด้วย Firestore Rules</p></div><div class="card"><b>บัญชีปัจจุบัน</b><p>${esc(me.email)}</p><span class="pill">${role==='admin'?'ผู้ดูแลระบบ':'ผู้อยู่อาศัย'}</span></div></div>`}
async function members(c){const rows=await getAll('users');c.innerHTML=`<div class="head"><div><h2>สมาชิก</h2><span class="muted">ข้อมูลผู้พักอาศัยใน Firestore</span></div><button class="btn primary" id="addMember">+ เพิ่มสมาชิก</button></div><div class="table-wrap"><table class="table"><thead><tr><th>ชื่อ</th><th>ห้อง</th><th>โทรศัพท์</th><th>สิทธิ์</th><th>สถานะ</th><th>จัดการ</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.nameTH||x.nameEN||'-')}</td><td>${esc(x.roomNumber||'-')}</td><td>${esc(x.phone||'-')}</td><td>${esc(x.role||'resident')}</td><td>${esc(x.status||'active')}</td><td><button class="btn outline" data-edit="${x.id}">แก้ไข</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">ยังไม่มีสมาชิก</td></tr>'}</tbody></table></div>`;$('addMember').onclick=()=>memberModal();document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>memberModal(rows.find(x=>x.id===b.dataset.edit)))}
function memberModal(x={}){$('modalCard').innerHTML=`<h3>${x.id?'แก้ไข':'เพิ่ม'}สมาชิก</h3><div class="field"><label>ชื่อ-นามสกุล</label><input id="mName" value="${esc(x.nameTH)}"></div><div class="field"><label>ห้อง</label><input id="mRoom" value="${esc(x.roomNumber)}"></div><div class="field"><label>เบอร์โทร</label><input id="mPhone" value="${esc(x.phone)}"></div><div class="field"><label>สถานะ</label><select id="mStatus"><option value="active">active</option><option value="temporary">temporary</option><option value="moved_out">moved_out</option></select></div><div class="actions"><button class="btn primary" id="saveMember">บันทึก</button><button class="btn outline" id="closeModal">ยกเลิก</button></div>`;$('mStatus').value=x.status||'active';$('modal').classList.remove('hidden');$('closeModal').onclick=closeModal;$('saveMember').onclick=async()=>{const data={nameTH:$('mName').value.trim(),roomNumber:$('mRoom').value.trim(),phone:$('mPhone').value.trim(),status:$('mStatus').value,updatedAt:new Date().toISOString()};if(x.id)await updateDoc(doc(db,'users',x.id),data);else await addDoc(collection(db,'users'),{...data,role:'resident',createdAt:new Date().toISOString()});closeModal();toast('บันทึกแล้ว');render()}}
function closeModal(){$('modal').classList.add('hidden')}
async function bills(c){let rows=await getAll('bills');if(role!=='admin')rows=rows.filter(x=>x.userId===me.uid);c.innerHTML=`<div class="head"><div><h2>ค่าใช้จ่าย</h2><span class="muted">บิลค่าเช่า/ไฟฟ้า/ส่วนกลาง</span></div>${role==='admin'?'<button class="btn primary" id="addBill">+ เพิ่มบิล</button>':''}</div><div class="table-wrap"><table class="table"><thead><tr><th>เดือน/ปี</th><th>ผู้ใช้</th><th>หน่วย</th><th>จำนวนเงิน</th><th>สถานะ</th><th>วันที่</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.month)}/${esc(x.year)}</td><td>${esc(x.userId)}</td><td>${esc(x.units)}</td><td>${money(x.amount)}</td><td><span class="badge ${x.status==='paid'?'ok':'warn'}">${esc(x.status||'unpaid')}</span></td><td>${date(x.createdAt)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">ยังไม่มีบิล</td></tr>'}</tbody></table></div>`;if(role==='admin')$('addBill').onclick=()=>billModal()}
function billModal(){$('modalCard').innerHTML=`<h3>เพิ่มบิล</h3><div class="field"><label>UID ผู้พัก</label><input id="bUid"></div><div class="two"><div class="field"><label>เดือน</label><input id="bMonth" type="number" min="1" max="12"></div><div class="field"><label>ปี ค.ศ.</label><input id="bYear" type="number" value="${new Date().getFullYear()}"></div></div><div class="field"><label>หน่วย</label><input id="bUnits" type="number" value="0"></div><div class="field"><label>จำนวนเงิน</label><input id="bAmount" type="number" step="0.01" value="0"></div><div class="actions"><button class="btn primary" id="saveBill">บันทึก</button><button class="btn outline" id="closeModal">ยกเลิก</button></div>`;$('modal').classList.remove('hidden');$('closeModal').onclick=closeModal;$('saveBill').onclick=async()=>{await addDoc(collection(db,'bills'),{userId:$('bUid').value.trim(),month:Number($('bMonth').value),year:Number($('bYear').value),units:Number($('bUnits').value),amount:Number($('bAmount').value),status:'unpaid',createdAt:new Date().toISOString()});closeModal();toast('เพิ่มบิลแล้ว');render()}}
async function repairs(c){let rows=await getAll('repairs');if(role!=='admin')rows=rows.filter(x=>x.userId===me.uid);c.innerHTML=`<div class="head"><div><h2>แจ้งซ่อม</h2><span class="muted">ติดตามงานซ่อม</span></div><button class="btn primary" id="addRepair">+ แจ้งซ่อม</button></div><div class="table-wrap"><table class="table"><thead><tr><th>ประเภท</th><th>รายละเอียด</th><th>ผู้แจ้ง</th><th>สถานะ</th><th>วันที่</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.type)}</td><td>${esc(x.description)}</td><td>${esc(x.userId)}</td><td><span class="badge">${esc(x.status||'pending')}</span></td><td>${date(x.createdAt)}</td><td>${role==='admin'?`<button class="btn outline" data-repair="${x.id}">เปลี่ยนสถานะ</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">ยังไม่มีรายการ</td></tr>'}</tbody></table></div>`;$('addRepair').onclick=()=>repairModal();document.querySelectorAll('[data-repair]').forEach(b=>b.onclick=async()=>{const s=prompt('สถานะใหม่: pending / in_progress / done','in_progress');if(['pending','in_progress','done'].includes(s)){await updateDoc(doc(db,'repairs',b.dataset.repair),{status:s,updatedAt:new Date().toISOString()});render()}})}
function repairModal(){$('modalCard').innerHTML=`<h3>แจ้งซ่อม</h3><div class="field"><label>ประเภท</label><select id="rType"><option>ไฟฟ้า</option><option>แอร์</option><option>ประปา</option><option>เฟอร์นิเจอร์</option><option>อื่นๆ</option></select></div><div class="field"><label>รายละเอียด</label><textarea id="rDesc" rows="5"></textarea></div><div class="actions"><button class="btn primary" id="saveRepair">ส่งแจ้งซ่อม</button><button class="btn outline" id="closeModal">ยกเลิก</button></div>`;$('modal').classList.remove('hidden');$('closeModal').onclick=closeModal;$('saveRepair').onclick=async()=>{await addDoc(collection(db,'repairs'),{userId:me.uid,type:$('rType').value,description:$('rDesc').value.trim(),imageUrls:[],status:'pending',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});closeModal();toast('ส่งแจ้งซ่อมแล้ว');render()}}
async function borrows(c){let rows=await getAll('borrows');if(role!=='admin')rows=rows.filter(x=>x.userId===me.uid);c.innerHTML=`<div class="head"><div><h2>ยืม-คืน</h2><span class="muted">จัดการรายการยืมอุปกรณ์</span></div><button class="btn primary" id="addBorrow">+ บันทึกการยืม</button></div><div class="table-wrap"><table class="table"><thead><tr><th>อุปกรณ์</th><th>จำนวน</th><th>ผู้ยืม</th><th>กำหนดคืน</th><th>สถานะ</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.item)}</td><td>${esc(x.quantity)}</td><td>${esc(x.userId)}</td><td>${date(x.dueDate)}</td><td>${esc(x.status||'borrowed')}</td><td>${x.status==='borrowed'?`<button class="btn outline" data-return="${x.id}">คืนของ</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">ยังไม่มีรายการ</td></tr>'}</tbody></table></div>`;$('addBorrow').onclick=()=>borrowModal();document.querySelectorAll('[data-return]').forEach(b=>b.onclick=async()=>{await updateDoc(doc(db,'borrows',b.dataset.return),{status:'returned',returnDate:new Date().toISOString()});toast('บันทึกการคืนแล้ว');render()})}
function borrowModal(){$('modalCard').innerHTML=`<h3>บันทึกการยืม</h3><div class="field"><label>ชื่ออุปกรณ์</label><input id="boItem"></div><div class="field"><label>จำนวน</label><input id="boQty" type="number" value="1" min="1"></div><div class="field"><label>กำหนดคืน</label><input id="boDue" type="date"></div><div class="actions"><button class="btn primary" id="saveBorrow">บันทึก</button><button class="btn outline" id="closeModal">ยกเลิก</button></div>`;$('modal').classList.remove('hidden');$('closeModal').onclick=closeModal;$('saveBorrow').onclick=async()=>{await addDoc(collection(db,'borrows'),{userId:me.uid,item:$('boItem').value.trim(),quantity:Number($('boQty').value),borrowDate:new Date().toISOString(),dueDate:$('boDue').value,returnDate:null,faceVerified:false,status:'borrowed'});closeModal();toast('บันทึกการยืมแล้ว');render()}}
async function profilePage(c){const p=profile||{};c.innerHTML=`<div class="head"><div><h2>โปรไฟล์</h2><span class="muted">ข้อมูลบัญชีของคุณ</span></div></div><div class="card"><div class="two"><div class="field"><label>ชื่อ</label><input id="pName" value="${esc(p.nameTH)}"></div><div class="field"><label>ห้อง</label><input id="pRoom" value="${esc(p.roomNumber)}"></div><div class="field"><label>โทรศัพท์</label><input id="pPhone" value="${esc(p.phone)}"></div><div class="field"><label>อีเมล</label><input value="${esc(me.email)}" disabled></div></div><button class="btn primary" id="saveProfile">บันทึกโปรไฟล์</button></div>`;$('saveProfile').onclick=async()=>{await setDoc(doc(db,'users',me.uid),{nameTH:$('pName').value.trim(),roomNumber:$('pRoom').value.trim(),phone:$('pPhone').value.trim(),updatedAt:new Date().toISOString()},{merge:true});profile=await userProfile(me);toast('บันทึกแล้ว');render()}}
async function logs(c){let rows=await getAll('eventLogs');rows.sort((a,b)=>String(b.timestamp||'').localeCompare(String(a.timestamp||'')));c.innerHTML=`<div class="head"><div><h2>ประวัติการใช้งาน</h2><span class="muted">บันทึกเหตุการณ์ของระบบ</span></div></div><div class="table-wrap"><table class="table"><thead><tr><th>เวลา</th><th>ผู้ใช้</th><th>เหตุการณ์</th><th>รายละเอียด</th></tr></thead><tbody>${rows.slice(0,200).map(x=>`<tr><td>${date(x.timestamp)}</td><td>${esc(x.userId)}</td><td>${esc(x.event)}</td><td>${esc(x.detail)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">ยังไม่มีประวัติ</td></tr>'}</tbody></table></div>`}

$('loginBtn').onclick=async()=>{err('');try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value)}catch(e){err('เข้าสู่ระบบไม่สำเร็จ: '+(e.code||e.message))}};
$('signupBtn').onclick=async()=>{err('');try{const cred=await createUserWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);await setDoc(doc(db,'users',cred.user.uid),{uid:cred.user.uid,nameTH:'สมาชิกใหม่',nameEN:'',phone:'',roomNumber:'',role:'resident',status:'active',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});toast('สร้างบัญชีแล้ว')}catch(e){err('สมัครไม่สำเร็จ: '+(e.code||e.message))}};
$('logoutBtn').onclick=()=>signOut(auth);
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
onAuthStateChanged(auth,async u=>{me=u;if(!u){$('auth').classList.remove('hidden');$('app').classList.add('hidden');return}try{profile=await userProfile(u);role=profile?.role==='admin'?'admin':'resident';$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('rolePill').textContent=role==='admin'?'ผู้ดูแลระบบ':'ผู้อยู่อาศัย';$('userEmail').textContent=u.email||'';view='dashboard';render()}catch(e){await signOut(auth);err('ไม่สามารถโหลดโปรไฟล์ได้')}});
</script>
