<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HOME • ระบบจัดการที่พัก</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:#f5f7fb;color:#182033}button,input{font:inherit}button{cursor:pointer}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#2563eb,#0f172a)}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:20px;box-shadow:0 8px 30px #0000000d}.login .card{width:min(390px,100%);text-align:center}.logo{font-size:48px}.field{text-align:left;margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input{width:100%;padding:11px;border:1px solid #dbe1ea;border-radius:10px}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:700}.primary{background:#2563eb;color:#fff}.outline{background:#fff;border:1px solid #dbe1ea}.hide{display:none!important}.top{height:62px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:5}.brand{font-weight:900;color:#2563eb}.user{display:flex;gap:8px;align-items:center}.badge{font-size:12px;font-weight:800;background:#dbeafe;color:#1d4ed8;padding:5px 9px;border-radius:99px}.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 62px)}aside{background:#111827;padding:14px}.nav{display:grid;gap:5px}.nav button{background:0 0;border:0;color:#cbd5e1;text-align:left;padding:11px;border-radius:9px}.nav button:hover,.nav .active{background:#1f2937;color:#fff}.main{max-width:1300px;width:100%;margin:auto;padding:22px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.head h2{margin:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.num{font-size:30px;font-weight:900;margin-top:5px}.muted{font-size:13px;color:#64748b}.section{margin-top:16px}.tablebox{overflow:auto;background:#fff;border:1px solid #e5e7eb;border-radius:15px}.table{width:100%;border-collapse:collapse;min-width:620px}.table th,.table td{padding:11px;border-bottom:1px solid #eef0f4;text-align:left;font-size:13px}.table th{background:#f8fafc}.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:16px;z-index:10}.modal .card{width:min(520px,100%)}@media(max-width:800px){.layout{display:block}aside{position:sticky;top:62px;overflow:auto;padding:7px}.nav{display:flex}.nav button{white-space:nowrap}.stats{grid-template-columns:1fr 1fr}.main{padding:14px}}@media(max-width:450px){.stats{grid-template-columns:1fr}.email{display:none}}
</style>
</head>
<body>
<div id="login" class="login"><div class="card"><div class="logo">🏠</div><h2>HOME</h2><p class="muted">ระบบจัดการที่พักอาศัย • ระบบใหม่</p><div class="field"><label>อีเมล</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>รหัสผ่าน</label><input id="password" type="password" autocomplete="current-password"></div><button id="loginBtn" class="btn primary" style="width:100%">เข้าสู่ระบบ</button><button id="signupBtn" class="btn outline" style="width:100%;margin-top:8px">สมัครบัญชี</button><p id="msg" class="muted"></p></div></div>
<div id="app" class="hide"><header class="top"><div class="brand">🏠 HOME</div><div class="user"><span id="role" class="badge"></span><span id="userEmail" class="muted email"></span><button id="logout" class="btn outline">ออก</button></div></header><div class="layout"><aside><nav id="nav" class="nav"></nav></aside><main id="main" class="main"></main></div></div>
<div id="modal" class="modal hide"><div id="modalBody" class="card"></div></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js';
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut}from'https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js';
import{getFirestore,collection,getDocs,doc,getDoc,addDoc,setDoc,updateDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js';
const config={apiKey:'AIzaSyCI4sasDSZOr8txLyeOl6RI-szFkW9gZx8',authDomain:'home-8e824.firebaseapp.com',projectId:'home-8e824',storageBucket:'home-8e824.firebasestorage.app',messagingSenderId:'798232728283',appId:'1:798232728283:web:4488a32b4f13c0141a72fe'};
const app=initializeApp(config),auth=getAuth(app),db=getFirestore(app);let me=null,userData=null,role='resident',page='dashboard';const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const get=async name=>(await getDocs(collection(db,name))).docs.map(d=>({id:d.id,...d.data()}));
$('loginBtn').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('email').value,$('password').value)}catch(e){$('msg').textContent='เข้าสู่ระบบไม่สำเร็จ'}};
$('signupBtn').onclick=async()=>{try{const c=await createUserWithEmailAndPassword(auth,$('email').value,$('password').value);await setDoc(doc(db,'users',c.user.uid),{uid:c.user.uid,email:c.user.email,role:'resident',status:'active',createdAt:serverTimestamp()})}catch(e){$('msg').textContent='สมัครบัญชีไม่สำเร็จ'}};
$('logout').onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{if(!u){$('login').classList.remove('hide');$('app').classList.add('hide');return}me=u;const s=await getDoc(doc(db,'users',u.uid));userData=s.exists()?s.data():{};role=userData.role==='admin'?'admin':'resident';$('login').classList.add('hide');$('app').classList.remove('hide');$('userEmail').textContent=u.email;$('role').textContent=role==='admin'?'ADMIN':'RESIDENT';render()});
function nav(){const a=role==='admin'?[['dashboard','📊 ภาพรวม'],['members','👥 สมาชิก'],['bills','💳 ค่าใช้จ่าย'],['repairs','🛠️ แจ้งซ่อม'],['borrows','📦 ยืม-คืน']]:[['dashboard','🏠 หน้าหลัก'],['bills','💳 ค่าใช้จ่าย'],['repairs','🛠️ แจ้งซ่อม'],['borrows','📦 ยืมของ'],['profile','👤 โปรไฟล์']];$('nav').innerHTML=a.map(x=>`<button class="${page===x[0]?'active':''}" data-page="${x[0]}">${x[1]}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()})}
async function render(){nav();$('main').innerHTML='<div class="card">กำลังโหลด...</div>';if(page==='dashboard')return dashboard();if(page==='members')return members();if(page==='bills')return list('bills','💳 ค่าใช้จ่าย','รายการ',role==='admin');if(page==='repairs')return list('repairs','🛠️ แจ้งซ่อม','หัวข้อ',false);if(page==='borrows')return list('borrows','📦 ยืม-คืน','สิ่งของ',false);if(page==='profile')return profile()}
async function dashboard(){const[a,b,c,d]=await Promise.all([get('users'),get('bills'),get('repairs'),get('borrows')]);$('main').innerHTML=`<div class="head"><div><h2>ภาพรวม</h2><span class="muted">ยินดีต้อนรับ ${esc(userData.nameTH||me.email)}</span></div></div><div class="stats"><div class="card"><span class="muted">สมาชิก</span><div class="num">${role==='admin'?a.length:1}</div></div><div class="card"><span class="muted">ค่าใช้จ่าย</span><div class="num">${role==='admin'?b.length:b.filter(x=>x.userId===me.uid).length}</div></div><div class="card"><span class="muted">แจ้งซ่อม</span><div class="num">${role==='admin'?c.length:c.filter(x=>x.userId===me.uid).length}</div></div><div class="card"><span class="muted">ยืม-คืน</span><div class="num">${role==='admin'?d.length:d.filter(x=>x.userId===me.uid).length}</div></div></div><div class="section card"><b>ระบบใหม่พร้อมใช้งาน</b><p class="muted">HTML + JavaScript + Firebase • ไม่มี Next.js และไม่มี React</p></div>`}
async function members(){const r=await get('users');$('main').innerHTML=`<div class="head"><h2>สมาชิก</h2><button id="add" class="btn primary">+ เพิ่มสมาชิก</button></div><div class="tablebox"><table class="table"><tr><th>ชื่อ</th><th>ห้อง</th><th>โทรศัพท์</th><th>สิทธิ์</th><th></th></tr>${r.map(x=>`<tr><td>${esc(x.nameTH||x.email)}</td><td>${esc(x.roomNumber||'-')}</td><td>${esc(x.phone||'-')}</td><td>${esc(x.role||'resident')}</td><td><button class="btn outline" data-edit="${x.id}">แก้ไข</button></td></tr>`).join('')}</table></div>`;$('add').onclick=()=>member();document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>member(r.find(x=>x.id===b.dataset.edit)))}
function member(x={}){$('modalBody').innerHTML=`<h3>${x.id?'แก้ไข':'เพิ่ม'}สมาชิก</h3>${[['nameTH','ชื่อ-นามสกุล'],['roomNumber','ห้อง'],['phone','โทรศัพท์']].map(a=>`<div class="field"><label>${a[1]}</label><input id="${a[0]}" value="${esc(x[a[0]])}"></div>`).join('')}<button id="save" class="btn primary">บันทึก</button> <button id="cancel" class="btn outline">ยกเลิก</button>`;$('modal').classList.remove('hide');$('cancel').onclick=()=>$('modal').classList.add('hide');$('save').onclick=async()=>{const d={nameTH:$('nameTH').value,roomNumber:$('roomNumber').value,phone:$('phone').value};x.id?await updateDoc(doc(db,'users',x.id),d):await addDoc(collection(db,'users'),{...d,role:'resident',status:'active',createdAt:serverTimestamp()});$('modal').classList.add('hide');render()}}
async function list(col,title,label,adminAdd){let r=await get(col);if(role!=='admin')r=r.filter(x=>x.userId===me.uid);$('main').innerHTML=`<div class="head"><h2>${title}</h2>${adminAdd?'<button id="add" class="btn primary">+ เพิ่ม</button>':'<button id="add" class="btn primary">+ เพิ่ม</button>'}</div><div class="tablebox"><table class="table"><tr><th>${label}</th><th>สถานะ</th><th>วันที่</th></tr>${r.map(x=>`<tr><td>${esc(x.title||x.item||x.description||'-')}</td><td>${esc(x.status||'pending')}</td><td>${x.createdAt?.seconds?new Date(x.createdAt.seconds*1000).toLocaleDateString('th-TH'):'-'}</td></tr>`).join('')}</table></div>`;$('add').onclick=()=>form(col,title)}
function form(col,title){$('modalBody').innerHTML=`<h3>${title}</h3><div class="field"><label>${col==='borrows'?'สิ่งของ':'หัวข้อ'}</label><input id="text"></div><div class="field"><label>รายละเอียด/จำนวน</label><input id="detail"></div><button id="save" class="btn primary">บันทึก</button> <button id="cancel" class="btn outline">ยกเลิก</button>`;$('modal').classList.remove('hide');$('cancel').onclick=()=>$('modal').classList.add('hide');$('save').onclick=async()=>{const d={userId:me.uid,status:'pending',createdAt:serverTimestamp()};d[col==='borrows'?'item':'title']=$('text').value;d.description=$('detail').value;await addDoc(collection(db,col),d);$('modal').classList.add('hide');render()}}
function profile(){$('main').innerHTML=`<div class="head"><h2>โปรไฟล์</h2></div><div class="card"><p><b>อีเมล</b><br>${esc(me.email)}</p><p><b>ชื่อ</b><br>${esc(userData.nameTH||'-')}</p><p><b>ห้อง</b><br>${esc(userData.roomNumber||'-')}</p><p><b>สิทธิ์</b><br>${esc(role)}</p></div>`}
</script></body></html>
